name: 博客质量检查

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: blog-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 检查与构建
    runs-on: ubuntu-latest
    steps:
      - name: 获取源码
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 安装固定依赖
        run: npm ci
      - name: 检查代码和行为
        run: npm run check
      - name: 构建静态页面
        run: npm run build
